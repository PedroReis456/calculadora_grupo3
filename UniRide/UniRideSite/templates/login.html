{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniRide — Login</title>
<link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="app nonav">
<main class="login">
<header><div class="logo-box"><img src="{% static 'img/logo.png' %}" alt="UniRide — carona universitária"></div><p>Conectando estudantes universitários</p></header>
<form class="sheet" action="{% url 'home' %}">
<div class="tabs"><a class="on" href="{% url 'login' %}">Entrar</a><a href="{% url 'login' %}#criar">Criar conta</a></div>
<label class="label" for="e">E-mail institucional</label><input id="e" type="email" placeholder="bernardo@puc-rio.br">
<label class="label" for="s">Senha</label><input id="s" type="password" placeholder="••••••••">
<a class="btn" href="{% url 'home' %}">Entrar</a>
<p class="forgot">Esqueceu sua senha? <a href="#">Recuperar</a></p>
</form></main>
</div>

</body>
</html>
